{% extends 'master.html' %}

{% block title %} Show Books {% endblock %}

{% block content %}
    <div class="container">
        {% for book in books %}
        	<h3>{{ book.title }}</h3>
            {% if book.cover %}
                <img src="{{ book.cover.url }}" alt="">
            {% endif %}
            <p>{{ book.isbn }}</p>
            {% if perms.myapp.delete_book %}
                <a href="{% url 'delete_book' book.id %}" class="btn btn-danger">Delete</a>
            {% endif %}
            <a href="{% url 'edit_book' book.id %}" class="btn btn-primary">Edit</a>
        {% endfor %}

    </div>
{% endblock %}
